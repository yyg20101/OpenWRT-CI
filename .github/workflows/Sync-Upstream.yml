name: Sync Upstream

on:
  schedule:
    # 每天同步一次：UTC 20:51 即北京时间次日 04:51，比 Auto-Clean 提前 30 分钟。
    - cron: '51 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main-custom
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yyg20101/OpenWRT-CI' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sync credential
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo '::error::请配置 SYNC_TOKEN：仅授权此 fork，Contents 和 Workflows 均为 Read and write。详见 docs/fork-sync.md。'
            exit 1
          fi

      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure upstream (fetch only)
        run: |
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
          git remote set-url --push upstream DISABLED
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Mirror main and merge into custom
        run: bash Scripts/Sync-Upstream.sh
